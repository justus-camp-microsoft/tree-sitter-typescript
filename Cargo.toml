[package]
name = "tree-sitter-typescript"
description = "TypeScript and TSX grammars for tree-sitter"
version = "0.23.2-erosion.1"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "typescript", "tsx"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/justus-camp-microsoft/tree-sitter-typescript"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/common/**",
  "/bindings/rust/**",
  "/typescript/grammar.js",
  "/typescript/src/**",
  "/tsx/grammar.js",
  "/tsx/src/**",
  "/queries/*",
  "/tree-sitter.json",
  "/package.json",
  "/package-lock.json",
  "/LICENSE",
  "/EROSION.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"
sha2 = "0.10"

[dev-dependencies]
tree-sitter = "=0.25.2"
